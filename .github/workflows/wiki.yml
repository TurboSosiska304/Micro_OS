# Build the wiki and publish it to the `gh-pages` branch of this repository.
#
# The site is a project page: https://turbososiska304.github.io/Micro_OS/ .
# The build itself is tools/wiki_build_versions.py (MkDocs + mike); the
# deployment is the whole `site/` directory, forced onto an orphan branch, so
# the kernel history never carries the generated HTML.
#
# The workflow lives on the `wiki` branch, which is where the site is built
# from - it is never merged into `mainline`, a release candidate or a feature
# branch. It runs on a push to `wiki`, every night (so a new release tag is
# picked up without a push) and by hand
# (`gh workflow run wiki.yml --ref wiki`). It builds every version from
# scratch each time: the tags are the source of the versions, and the branch
# is derived, not edited. See docs/wiki/deploy.md.

name: wiki

on:
  push:
    branches: [wiki]
    paths:
      - "docs/wiki/**"
      - "docs/theme/**"
      - "mkdocs.yml"
      - "tools/wiki_build_versions.py"
      - "tools/wiki_check.py"
      - ".github/workflows/wiki.yml"
  schedule:
    # A release is a tag on mainline; this branch does not see that push.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag is a version of the wiki; a shallow clone would hide
          # the history that the build reads with `git archive`.
          fetch-depth: 0
          # The theme, the builder and the `dev` pages are this branch; the
          # releases come from the tags, which live on mainline.
          ref: wiki

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch every tag
        # A tag is a version of the wiki even if it points outside the branch
        # that was checked out; `git archive` reads the tag, not the worktree.
        run: git fetch --tags --force

      - name: Install MkDocs, mike and Pygments
        run: pip install "mkdocs==1.6.1" "mike==2.2.0" "pygments==2.21.0"

      - name: Check the links of the pages
        run: python tools/wiki_check.py

      - name: Build every version
        run: python tools/wiki_build_versions.py --site site

      - uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: site
          retention-days: 7

  deploy:
    name: publish gh-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wiki-site
          path: site

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          user_name: "Micro OS wiki builder"
          user_email: "microos-wiki@users.noreply.github.com"
          commit_message: "docs: build the wiki (${{ github.ref_name }})"
