# Micro OS — the checks of the cloud.
#
# The same list as `make ci` before a push, and the firmware on top of it:
# the unit tests, the same tests under valgrind, the sanitizers, the smoke
# test of the simulator and the integrity of the repository. A fresh
# checkout has no dist/ (the bundle checks skip until a job builds it) and
# no clang-format of the right version, so the host job installs the
# formatter that `make format` uses — the sources are formatted with
# clang-format 23 and the runner alone would bring an older one and fail
# on style — and the firmware job runs the integrity check a second time
# with the bundle it has just built.

name: ci

on:
  push:
    branches: [mainline, release_candidate]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: tests and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the unit tests
        run: make test

      - name: the same tests under valgrind
        run: valgrind --error-exitcode=42 --track-origins=yes ./build-host/tests/microos_tests

      - name: the tests with the address and UB sanitizers
        run: make test-asan

      - name: the smoke test of the simulator
        run: make smoke

      - name: the formatter of the sources (the version of make format)
        run: |
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install -q clang-format==23.1.3
          echo "$RUNNER_TEMP/cf/bin" >> "$GITHUB_PATH"

      - name: the integrity of the repository
        run: make integrity

  firmware:
    name: the firmware for the ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.3
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the checkout is safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: the build of the firmware
        run: idf.py build

      - name: the bundle of dist/
        run: tools/bundle.sh build dist

      - name: the integrity against the bundle
        run: python3 tools/integrity_check.py --verbose

      - name: the firmware as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
