# Micro OS — the checks of the cloud.
#
# The same list as `make ci` before a push, and the firmware on top of it:
# the unit tests, the same tests under valgrind, the sanitizers, the smoke
# test of the simulator and the integrity of the repository. `make ci` now
# runs TSan too, and boots the x86-64 port when `qemu-system-x86_64` is on
# PATH — the cloud installs qemu below, so both halves see the same checks.
# A fresh checkout has no dist/ (the bundle checks skip until a job builds
# it) and no clang-format of the right version, so the host job installs the
# formatter that `make format` uses — the sources are formatted with
# clang-format 23 and the runner alone would bring an older one and fail
# on style — and the firmware job runs the integrity check a second time
# with the bundle it has just built.

name: ci

on:
  push:
    branches: [mainline, release_candidate]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read

# Reproducible builds: one moment for the records and the build id, the
# same source paths (the Makefile exports the same default).
env:
  SOURCE_DATE_EPOCH: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: tests and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the unit tests
        run: make test

      - name: valgrind for the runner (the image alone has none)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends valgrind

      - name: the same tests under valgrind
        run: valgrind --error-exitcode=42 --track-origins=yes ./build-host/tests/microos_tests

      - name: the tests with the address and UB sanitizers
        run: make test-asan

      - name: the same tests under the race detector
        run: make test-tsan

      - name: the smoke test of the simulator
        run: make smoke

      - name: the lines of the kernel
        run: make coverage

      - name: qemu for the x86-64 machine
        run: sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: the kernel boots on x86-64
        run: make x86-smoke

      - name: the same image twice
        run: make reproducible

      # A machine that stops before the shell leaves the binary as the only
      # witness: the console says where, and the image says which instruction.
      - name: the build of the machine that did not boot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86-build
          path: build-x86/

      - name: the formatter of the sources (the version of make format)
        run: |
          python3 -m venv "$RUNNER_TEMP/cf" || python -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install -q clang-format==23.1.3
          echo "$RUNNER_TEMP/cf/bin" >> "$GITHUB_PATH"

      - name: the integrity of the repository
        run: make integrity

  firmware:
    name: the firmware for the ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.3
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the checkout is safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The steps of Actions run through docker exec and miss the
      # entrypoint of the image, the one that sources export.sh — the
      # shell of the step does it itself (IDF_PATH=/opt/esp/idf).
      - name: the build of the firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          idf.py build

      # The container of ESP-IDF carries the toolchain of the board and not
      # the host tools of the other machine.
      - name: the tools of the x86-64 port
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build build-essential

      - name: the kernel of the x86-64 port
        run: make x86-build

      - name: the bundle of dist/
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          tools/bundle.sh build dist

      # The same inputs, the same bytes: the second bundle of the same build
      # has to be a copy of the first, images and archive alike. This is the
      # half of the gate that needs ESP-IDF; `make reproducible` is the half
      # of the laptop.
      - name: the bundle twice
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          cp -a dist dist-first
          tools/bundle.sh build dist
          diff -r dist-first dist

      # A build of its own, not a copy of the first: the same sources and
      # SOURCE_DATE_EPOCH have to give the same application and bootloader.
      - name: the firmware twice
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          idf.py -B build-repro build
          for image in micro_os.bin bootloader/bootloader.bin \
                       partition_table/partition-table.bin; do
              cmp "build/$image" "build-repro/$image"
          done

      - name: the integrity against the bundle
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          python3 tools/integrity_check.py --verbose

      - name: the firmware as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
