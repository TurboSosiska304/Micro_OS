# Micro OS — the autobuild of the release candidate, and its delivery.
#
#   release_candidate   the branch of the release candidate (the main one)
#   mainline            the branch of the stable release
#
# Every push builds the firmware for the ESP32 and checks the integrity of
# the repository and of the bundle in dist/. A tag of the form vX.Y.Z
# publishes the bundle as a GitHub release.
#
# The tests of the code itself (the unit tests and the smoke test of the
# simulator) are not here: they belong to the contributor, on their machine
# (make ci), until the first release gives them their own CI/CD. What is
# here speaks about the artifact that goes onto the board.
#
# The style of the sources is checked with a pinned clang-format
# (CLANG_FORMAT_VERSION): a different version formats the sources
# differently and the check would only argue about the spaces.

name: CI

on:
  push:
    branches: [release_candidate, mainline]
    tags: ["v*"]
  pull_request:
    branches: [release_candidate, mainline]
  workflow_dispatch:
  schedule:
    # Once a week, on Monday morning: the dependencies get old, the build
    # has to keep working anyway.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  # --- the integrity of the repository and of the bundle ---------------------

  integrity:
    name: the integrity check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history: git fsck has to check every object.
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          # The venv keeps the tool away from the system python: the newer
          # distributions do not allow pip to install into it.
          python3 -m venv /tmp/ci-tools
          /tmp/ci-tools/bin/pip install --upgrade "clang-format==$CLANG_FORMAT_VERSION"
          echo "/tmp/ci-tools/bin" >> "$GITHUB_PATH"

      - name: The check
        run: python3 tools/integrity_check.py --verbose --json integrity-report.json

      - name: The report of the check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integrity-report
          path: integrity-report.json
          if-no-files-found: warn

  # --- the firmware for the ESP32 --------------------------------------------

  firmware:
    name: the firmware of the ESP32
    runs-on: ubuntu-latest

    # The official image of the ESP-IDF: the build is the same as the one on
    # the developer machine, down to the version of the toolchain. The tag is
    # the version of the branch release-v5.3 of ESP-IDF, the same one the
    # project is written for.
    container:
      image: espressif/idf:v5.3

    steps:
      - name: Trust the workspace
        # The files of the workspace belong to the runner, git refuses to
        # touch them as root without this.
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7

      # The image keeps the ESP-IDF in /opt/esp/idf and says so in IDF_PATH,
      # but the commands of the IDF are on PATH only after export.sh: it is
      # sourced before every step that calls idf.py. Skipping this is what
      # made the previous run of this job fail with "idf.py: command not
      # found".
      - name: The environment of the ESP-IDF
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          echo "IDF_PATH=$IDF_PATH"

      - name: The build of the firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: The size of the firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size

      - name: The bundle
        run: tools/bundle.sh build dist

      - name: The integrity of the bundle
        # The fresh binaries against the sources: the partition table against
        # partitions.csv, the flash size against sdkconfig.defaults, the
        # magic of the image against the format of the ESP-IDF. The git
        # objects and the format of the sources are checked by the job
        # above: this one only speaks about what was just built.
        run: python3 tools/integrity_check.py --skip-git --skip-format

      - name: The artifacts of the firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            dist/
            build/micro_os.elf
            build/micro_os.map
          if-no-files-found: error

  # --- the release -----------------------------------------------------------

  release:
    name: the release
    needs:
      - integrity
      - firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: The version of the tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the tag is $GITHUB_REF_NAME, the kernel must be $version"

      - name: The kernel must have the version of the tag
        run: |
          python3 tools/integrity_check.py \
            --expect-version "${{ steps.tag.outputs.version }}" \
            --skip-git --skip-format

      # The artifact keeps the layout of the repository: dist/ with the
      # bundle and build/ with the elf and the map of the last build.
      - name: The artifacts of the firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware

      - name: Check the bundle
        run: |
          # The archives do not keep the permissions of the files.
          chmod +x dist/flash.sh
          cd dist && sha256sum -c checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: Micro OS ${{ steps.tag.outputs.version }}
          files: |
            dist/micro_os.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/checksums.txt
            dist/flash.sh
            dist/README.md
            build/micro_os.elf
            build/micro_os.map
          generate_release_notes: true
          fail_on_unmatched_files: true
