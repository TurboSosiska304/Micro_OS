# Micro OS — the release of a tag.
#
# A tag v* runs the tests, builds the firmware in the container of
# ESP-IDF, checks the integrity of the repository against the tag (the
# numbers and the suffix: v1.2.0-rc1 needs a kernel of 1.2.0 with "-rc1",
# the flag is --expect-tag) and makes a GitHub Release with the bundle: the
# binaries, their sums and the flash script. A tag with a dash
# (v0.2.0-pre) is a pre-release.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: the tests before the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the unit tests
        run: make test

      - name: the tests with the address and UB sanitizers
        run: make test-asan

  build:
    name: the firmware of the tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.3
    env:
      # The private key of the release (ADR 0020). It is a secret of the
      # repository and lives outside the tree; an empty one signs the bundle
      # with the key of the x86-64 build and the release notes say so.
      MICROOS_SIGN_KEY: ${{ secrets.MICROOS_SIGN_KEY }}
    steps:
      - name: the repository
        uses: actions/checkout@v4

      - name: the checkout is safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The secret is the key material (hex), not a path: write it where the
      # tool expects a file. A value that is already a path is left alone.
      - name: the key of the release
        shell: bash
        run: |
          if [ -n "${MICROOS_SIGN_KEY:-}" ] && [ ! -f "$MICROOS_SIGN_KEY" ]; then
            umask 077
            printf '%s\n' "$MICROOS_SIGN_KEY" > "$RUNNER_TEMP/release.key"
            echo "MICROOS_SIGN_KEY=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"
          fi

      # The container of ESP-IDF carries the toolchain of the board and not
      # the host tools: the firmware build compiles microos_sign_host with
      # the host cc to turn the signing key into the public half of the
      # image, and the x86-64 port needs cmake and ninja. Install them
      # before either build.
      - name: the host tools of both machines
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build build-essential e2fsprogs dosfstools

      # The steps of Actions run through docker exec and miss the
      # entrypoint of the image, the one that sources export.sh — the
      # shell of the step does it itself (IDF_PATH=/opt/esp/idf).
      - name: the build of the firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          idf.py build

      # The host tools include microos_sign, which signs the bundle and is
      # needed by the step below, and the mkfs of the disk of the complete
      # machine. The x86-64 build has its own copy of the signer.
      - name: the tools of the host
        # The container exports IDF_PATH; the top level CMake would take the
        # firmware branch and look for the Xtensa compiler. The host tools are
        # a plain CMake build and name no platform.
        env:
          IDF_PATH: ""
        run: make build

      # The complete machine: the kernel with the network, the disk with
      # /bin and /etc, and the run.sh of `make x86-user`. The bundle below
      # packages these files, so the tar of a release is a machine a person
      # starts, not only a kernel.
      # The container exports IDF_PATH, and the top level CMake would take
      # the firmware branch and look for the Xtensa compiler. The complete
      # machine is a host build and an x86-64 build; it names no platform.
      - name: the complete machine of the x86-64 port
        env:
          IDF_PATH: ""
        run: make x86-all

      # The bootable CD of the x86-64 machine: xorriso writes the image and
      # limine is the boot loader of its catalogue. Both are a package of the
      # distribution; a container that cannot install them makes a bundle
      # without the CD, and the step says so instead of failing the release.
      - name: the bootable CD of the x86-64 machine
        shell: bash
        run: |
          (apt-get update -qq && apt-get install -y -qq xorriso limine) >/dev/null 2>&1 || true
          make x86-iso || echo "the CD is not in this bundle: xorriso or limine is missing"

      # esptool lives in the python environment of the image, and the step
      # that builds the bundle is where it is needed (merge_bin).
      - name: the bundle of dist/
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          tools/bundle.sh build dist

      - name: the integrity against the version of the tag
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          python3 tools/integrity_check.py --verbose --expect-tag "$GITHUB_REF_NAME"

      - name: the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/

  release:
    name: the GitHub release
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The notes are generated from the history of the repository,
      # so the release job needs the repository itself — with the
      # whole history, the notes compare against the earlier tags.
      - name: the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the bundle of the build
        uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - name: the release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
            *) flags="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Micro OS $GITHUB_REF_NAME" \
            --notes "Micro OS $GITHUB_REF_NAME. Two machines: the firmware for the M5Stack StickC Plus2 and the kernel for QEMU x86-64.\n\nThe board: MicroOS-<version>.bin is the merged image and flash.sh writes it with the signature trailer. The bundle also carries micro_os.bin, progs.bin, bootloader.bin, the partition table and the sums of all of them. The layout of 1.1 has two application slots and a progs partition: a board of 1.0 loses its MicroFS volume once at the move - back it up, then use flash.sh --erase-volume, or run mkfs -y at the shell. The NVS (WiFi, /etc, the version floor) survives a flash and an update. An update over USB with a rollback is ota_usb.py: it writes the inactive slot, and a boot that never confirms itself, or an image whose signature does not match, returns the board to the previous slot. The signature trailer is a check of the download by the loader and the application, not secure boot; microos-sign.pub verifies it with tools/microos_sign.\n\nThe PC: MicroOS-x86_64-<version>.tar.gz carries the kernel, the loader and run.sh; the x86-64 loader verifies SHA-256 and Ed25519 before it copies a byte." \
            --generate-notes \
            $flags
