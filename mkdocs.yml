# The site of the Micro OS wiki: its own minimal theme, one directory per
# version under the GitHub Pages address of the repository. That address is a
# project page, not a domain: everything lives under /Micro_OS/, and the links
# of the theme and of the version switch carry that prefix. When a domain
# exists, `site_url` and `extra.base_path` change together, and the build
# writes a CNAME file into the site.
#
#     python3 -m venv ~/.local/share/opencode/wiki-venv
#     ~/.local/share/opencode/wiki-venv/bin/pip install mkdocs mike pygments
#     ~/.local/share/opencode/wiki-venv/bin/mkdocs serve
#
# A single version is `mkdocs build`; every version of every tag is
# `tools/wiki_build_versions.py`, which also writes the mike-compatible layout
# and is what the deployment uses. The pages are plain Markdown and GitHub
# renders them as they are, so `make ci` does not need MkDocs.

site_name: Micro OS
site_description: A Linux-like kernel for small machines
site_url: https://turbososiska304.github.io/Micro_OS/
repo_url: https://github.com/TurboSosiska304/Micro_OS
repo_name: TurboSosiska304/Micro_OS

docs_dir: docs/wiki
site_dir: site

# The theme is local and has no framework: one template, one stylesheet.
theme:
  name: null
  custom_dir: docs/theme
  locale: en

nav:
  - Home: README.md
  - The 1.0 release: release-1.0.md
  - Start here: getting-started.md
  - Build and run: build.md
  - Shell: shell.md
  - Files: files.md
  - Programs: programs.md
  - Ports: ports.md
  - Porting: porting.md
  - Kernel and ABI: kernel-abi.md
  - Testing: testing.md
  - Troubleshooting: troubleshooting.md
  - Versions: versions.md
  - Deploying the site: deploy.md

plugins:
  - search

# A link that leaves docs_dir is a canonical document of the repository; the
# hook rewrites it to GitHub at the ref of the build instead of a 404.
hooks:
  - tools/wiki_hooks.py

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
      css_class: highlight
  - toc:
      permalink: true

# The values below are the ones of a local `mkdocs serve`: the build script
# replaces them per version (and the template only reads them). `base_path`
# is the prefix of the deployment, not of a bare local server; the preview of
# the whole site is served from a directory that has a `Micro_OS/` entry.
extra:
  version: dev
  version_kind: dev
  has_wiki: true
  latest: ""
  latest_stable: ""
  latest_stable_has_wiki: false
  newest: ""
  dev_ref: main
  dev_commit: ""
  wiki_ref: main
  wiki_docs_prefix: docs/wiki
  base_path: /Micro_OS/
  landing_url: https://turbososiska304.github.io/microos-site/
  edit_base: https://github.com/TurboSosiska304/Micro_OS/blob/main/docs/wiki/
  version_groups:
    - label: Development
      versions:
        - version: dev
          kind: dev
          has_wiki: true

# The wiki links into the rest of docs/ on purpose, and those targets live
# outside docs_dir: the site has no copy of them to check, so a missing one is
# not an error of the page. The links are checked by tools/wiki_check.py.
validation:
  links:
    not_found: ignore
