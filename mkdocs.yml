# The site of the Micro OS wiki: a draft, served by hand.
#
#     python3 -m pip install --user mkdocs mkdocs-material
#     mkdocs serve
#
# The site is not a part of the build: `make ci` does not need mkdocs, the
# pages are plain Markdown that GitHub renders on its own, and `site/` is a
# generated directory that is never committed. If mkdocs-material is not
# installed, replace the theme below with `readthedocs`, which ships with
# plain mkdocs.
site_name: Micro OS
site_description: A Linux-like kernel for small machines
repo_url: https://github.com/TurboSosiska304/Micro_OS

docs_dir: docs/wiki
site_dir: site

theme:
  name: material

nav:
  - Home: README.md
  - Start here: getting-started.md
  - Build and run: build.md
  - Shell: shell.md
  - Files: files.md
  - Programs: programs.md
  - Ports: ports.md
  - Kernel and ABI: kernel-abi.md
  - Testing: testing.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# The wiki links into the rest of docs/ on purpose, and those targets live
# outside docs_dir: the site has no copy of them to check, so a missing one is
# not an error of the page. The links are checked by tools/wiki_check.py.
validation:
  links:
    not_found: ignore
